<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Rocmn Cheats</title>
<link rel="icon" href="https://rocmn.pythonanywhere.com/image/logo.png">

<meta name="theme-color" content="#17171a">
<meta property="og:title" content="Contact | Rocmn Cheats">
<meta property="og:description" content="Neem contact op met Rocmn Cheats.">
<meta property="og:image" content="https://rocmn.pythonanywhere.com/image/logo.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --Bg:#17171a;
  --Card:#1e1e22;
  --Line:#2e2e34;
  --LineH:#4a4a52;
  --T1:#ffffff;
  --T2:#b4b4bc;
  --T3:#7a7a83;
  --Acc:#ffffff;
  --AccSoft:rgba(255,255,255,0.08);
  --R:8px;
  --Rs:6px;
  --Ff:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --PadX:4vw;
  --PadY:5vh;
  --PageMax:92vw;
  --Cont:56vw;
  --Base:clamp(15px, 1.05vw, 19px);
}

*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  scrollbar-width:none;
  scroll-behavior:smooth;
  font-size:var(--Base);
}
html::-webkit-scrollbar{display:none;width:0;height:0}

body{
  margin:0;
  min-height:100vh;
  color:var(--T1);
  font-family:var(--Ff);
  font-size:1rem;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background-color:var(--Bg);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(circle at 85% 90%, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 60%),
    radial-gradient(rgba(255,255,255,0.11) 1.2px, transparent 1.4px),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%);
  background-size:
    100% 100%,
    100% 100%,
    1.5rem 1.5rem,
    100% 100%;
  background-attachment:fixed, fixed, fixed, fixed;
}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.02em;line-height:1.2}
p{margin:0}
p + p{margin-top:0.85rem}
:focus-visible{outline:2px solid var(--Acc);outline-offset:3px;border-radius:var(--Rs)}

.Page{
  max-width:var(--PageMax);
  margin:0 auto;
  padding:var(--PadY) var(--PadX);
}
.Cont{
  max-width:var(--Cont);
  margin:0 auto;
}

.Back{
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  color:var(--T2);
  font-size:0.9em;
  transition:color .15s ease;
}
.Back:hover{color:var(--T1)}
.Back i{font-size:0.75em}

.Head{
  margin-top:5vh;
  margin-bottom:5vh;
}
.HeadTitle{
  font-size:clamp(2rem,3.6vw,3.5rem);
  font-weight:700;
  letter-spacing:-0.03em;
  color:var(--T1);
  margin-bottom:0.6em;
}
.HeadLead{
  color:var(--T2);
  font-size:1.05em;
  line-height:1.6;
  max-width:32rem;
}

.Copy{
  display:flex;
  align-items:center;
  gap:0.5rem;
  background:var(--Card);
  border:1px solid var(--Line);
  border-radius:var(--R);
  padding:0.55em 0.55em 0.55em 1em;
  transition:border-color .18s ease;
}
.Copy:hover{
  border-color:var(--LineH);
}
.Copy.is-copied{
  border-color:var(--Acc);
}
.CopyVal{
  flex:1 1 auto;
  min-width:0;
  color:var(--T1);
  font-family:var(--Ff);
  font-size:1em;
  letter-spacing:-0.005em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  user-select:all;
}
.CopyBtn{
  appearance:none;
  border:0;
  background:var(--AccSoft);
  color:var(--T1);
  width:2.4em;
  height:2.4em;
  flex-shrink:0;
  border-radius:var(--Rs);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:1em;
  transition:background-color .18s ease;
}
.CopyBtn:hover{
  background:rgba(255,255,255,0.14);
}
.Copy .IcoCopy{display:inline-block}
.Copy .IcoCheck{display:none}
.Copy.is-copied .IcoCopy{display:none}
.Copy.is-copied .IcoCheck{display:inline-block}

.Foot{
  margin-top:10vh;
  padding-top:4vh;
  border-top:1px solid var(--Line);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1em;
  font-size:0.85em;
  color:var(--T3);
}
.FootNav{
  display:flex;
  align-items:center;
  gap:1.5em;
  flex-wrap:wrap;
  justify-content:center;
}
.FootNav a{
  color:var(--T2);
  transition:color .15s ease;
}
.FootNav a:hover{
  color:var(--T1);
}

.Toast{
  position:fixed;
  left:50%;
  bottom:3vh;
  transform:translateX(-50%) translateY(1em);
  background:var(--Acc);
  color:#17171a;
  font-size:0.875em;
  font-weight:500;
  padding:0.55em 0.9em;
  border-radius:var(--Rs);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  z-index:9999;
}
.Toast.is-visible{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media (max-width:900px){
  :root{
    --PadX:5vw;
    --PadY:4vh;
    --PageMax:100vw;
    --Cont:100%;
    --Base:clamp(15px, 4vw, 18px);
  }
  .Page{
    padding-inline:var(--PadX);
  }
  .Head{
    margin-top:4vh;
    margin-bottom:4vh;
  }
  .HeadTitle{
    font-size:clamp(1.75rem,8vw,2.5rem);
    letter-spacing:-0.03em;
  }
  .HeadLead{
    font-size:1em;
    max-width:100%;
  }
  .Copy{
    padding:0.6em 0.6em 0.6em 1em;
  }
  .CopyVal{
    font-size:0.95em;
  }
  .CopyBtn{
    width:2.6em;
    height:2.6em;
  }
}

@media (max-width:420px){
  .CopyVal{
    font-size:0.9em;
  }
}
</style>
</head>
<body>

<div class="Page">
  <div class="Cont">

    <a class="Back" href="/">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      Terug naar home
    </a>

    <header class="Head">
      <h1 class="HeadTitle">Contact</h1>
      <p class="HeadLead">
        Voor vragen, ideeën of als je een tool wilt aanvragen.
        Kopieer het adres hieronder.
      </p>
    </header>

    <div class="Copy" id="Copy">
      <span class="CopyVal" id="Mail">rocmncheats@proton.me</span>
      <button class="CopyBtn" id="CopyBtn" type="button" aria-label="Kopieer e-mailadres">
        <i class="fa-regular fa-copy IcoCopy" aria-hidden="true"></i>
        <i class="fa-solid fa-check IcoCheck" aria-hidden="true"></i>
      </button>
    </div>

    <footer class="Foot">
      <nav class="FootNav" aria-label="Footer">
        <a href="/">Home</a>
        <a href="/tools/">Tools</a>
        <a href="/contact/">Contact</a>
      </nav>
      <p>Rocmn Cheats, credits naar SamK</p>
    </footer>

  </div>
</div>

<div class="Toast" id="Toast" role="status" aria-live="polite">Gekopieerd</div>

<script>
"use strict";

(() => {
  const Copy = document.getElementById("Copy");
  const Btn = document.getElementById("CopyBtn");
  const Mail = document.getElementById("Mail");
  const Toast = document.getElementById("Toast");
  const Val = Mail.textContent.trim();
  let Timer;

  const Flash = () => {
    Toast.classList.add("is-visible");
    clearTimeout(Timer);
    Timer = setTimeout(() => Toast.classList.remove("is-visible"), 1600);
  };

  const DoCopy = async () => {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(Val);
      } else {
        const Ta = document.createElement("textarea");
        Ta.value = Val;
        Ta.style.position = "fixed";
        Ta.style.opacity = "0";
        document.body.appendChild(Ta);
        Ta.select();
        document.execCommand("copy");
        document.body.removeChild(Ta);
      }

      Copy.classList.add("is-copied");
      Flash();
      setTimeout(() => Copy.classList.remove("is-copied"), 1400);
    } catch {}
  };

  Btn.addEventListener("click", DoCopy);
})();
</script>

</body>
</html>
